name: Build APK

on:
  push:
    branches: [ccr-94f149fe-qradju, main]
    paths: ['app/**', 'firebase/**', 'admin/**', '.github/workflows/build-apk.yml', 'docs/schema/**', 'tool/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit the APK to releases/ in the repository (every publish adds ~60 MB to git history)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Firestore rules tests (emulator)
        working-directory: firebase
        run: |
          npm install
          npm test
      - name: Admin panel tests (unit, UI, and the real Firebase API on the emulators) and build
        working-directory: admin
        run: |
          npm install
          npm run test:emulator
          npm run build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Schema is in sync (docs/schema/local.sql -> Drift)
        working-directory: .
        run: |
          python3 -I tool/check_schema.py
          python3 -I tool/sync_schema.py
          git diff --exit-code app/lib/data/db/schema.drift

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release signing (only when the repository secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release keystore"
          else
            echo "No release keystore secret: APK will be signed with the debug key (fine for installing, not for the Play Store)"
          fi

      - name: Build APK and AAB
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: dt-food-pos-android
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols/

      - name: Keep the APK in the repository (releases/), manual publish runs only
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: .
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p releases
          # one APK per CPU type keeps each file small; arm64 is for nearly every phone made since 2017, armv7 for older 32-bit phones
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk releases/dt-food-pos-latest.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk releases/dt-food-pos-armv7-old-phones.apk
          (cd releases && sha256sum dt-food-pos-latest.apk dt-food-pos-armv7-old-phones.apk > dt-food-pos-latest.apk.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "ci: build APK ${VERSION} (run ${{ github.run_number }}) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
