name: Admin panel and backend tests
on:
  push:
    branches: [ccr-94f149fe-qradju, main]
    paths: ['admin/**', 'backend/**', '.github/workflows/backend-admin.yml']
jobs:
  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm test
      - run: npm run build
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo service postgresql start || sudo systemctl start postgresql
      - run: |
          sudo -u postgres createdb dtfood_test
          for f in backend/tests/auth_stub.sql backend/supabase/migrations/0001_dtfood.sql backend/tests/0001_dtfood_test.sql; do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -q -d dtfood_test -f "$PWD/$f"
          done
