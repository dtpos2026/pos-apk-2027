name: dt_food_pos
description: "DT Food POS: offline-first restaurant POS. Powered by Digital Target."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  cloud_firestore: ^7.1.0
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  drift: ^2.31.0
  file_picker: ^13.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  lottie: ^3.6.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.0
  uuid: ^4.6.0
  workmanager: ^0.10.10
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
